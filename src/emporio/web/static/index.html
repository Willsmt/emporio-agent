<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empório da Música — Atendimento</title>
<link rel="icon" href="/static/mel_icon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #1d1a17;
    --paper: #f6f1e9;
    --card: #fffdf9;
    --wood: #8a4b20;
    --wood-dark: #5e3214;
    --brass: #c8962e;
    --muted: #7a7065;
    --line: #e6dccd;
    --mel: #fbf4e7;
    --you: #2f2a25;
    --error: #a3361f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--paper);
  }
  header {
    background: var(--wood-dark); color: #fff; padding: 14px 20px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 4px solid var(--brass);
  }
  .logo {
    width: 40px; height: 40px; border-radius: 50%; background: var(--brass);
    display: grid; place-items: center; font-weight: 700; color: var(--wood-dark); font-size: 18px;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
  header p { margin: 0; font-size: 12.5px; opacity: .8; }
  header .spacer { flex: 1; }
  header button {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  header button:hover { background: rgba(255,255,255,.1); }
  main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 20px 16px 8px; display: flex; flex-direction: column; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; white-space: normal; word-wrap: break-word; }
  .msg.mel { align-self: flex-start; background: var(--mel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.you { align-self: flex-end; background: var(--you); color: #fff; border-bottom-right-radius: 4px; }
  .msg.error { align-self: center; background: #fbe9e4; color: var(--error); border: 1px solid #efc6ba; font-size: 13.5px; }
  .who { font-size: 11.5px; font-weight: 600; color: var(--wood); margin-bottom: 2px; }
  details.trace { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details.trace summary { cursor: pointer; }
  details.trace code { display: block; background: #f1e8da; border-radius: 6px; padding: 4px 8px; margin-top: 4px; white-space: pre-wrap; color: var(--wood-dark); }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding-left: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
  .chips button {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    cursor: pointer; font-size: 13px; color: var(--wood-dark);
  }
  .chips button:hover { border-color: var(--brass); }
  form { position: sticky; bottom: 0; background: var(--paper); padding: 10px 0 16px; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px;
    font: inherit; background: var(--card); min-height: 46px; max-height: 140px;
  }
  textarea:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  form button {
    background: var(--wood); color: #fff; border: 0; border-radius: 14px; padding: 0 20px;
    font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  .footnote { text-align: center; font-size: 11.5px; color: var(--muted); padding-bottom: 10px; }
  .demo-banner {
    display: none; background: #fff4d6; color: #6b4a00; border-bottom: 1px solid #ecd9a4;
    font-size: 12.5px; padding: 8px 20px; text-align: center;
  }
  .demo-banner strong { color: #5a3d00; }
  body.embed header { padding-right: 52px; } /* room for the store widget's close button */
</style>
</head>
<body>
<header>
  <img class="logo" src="/static/mel_icon.svg" alt="" aria-hidden="true">
  <div>
    <h1>Empório da Música</h1>
    <p>Mel, assistente virtual<span id="model"></span></p>
  </div>
  <div class="spacer"></div>
  <button id="reset" type="button">Nova conversa</button>
</header>
<div class="demo-banner" id="demo-banner" role="note">
  <strong>Modo demonstração</strong> · exibe o modelo e as consultas internas (tools) de cada resposta, para avaliação técnica.
  Em produção (<code>DEMO_MODE=false</code>) fica desligado e o cliente vê apenas a conversa.
</div>

<main>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <textarea id="input" rows="1" maxlength="1000" placeholder="Digite sua mensagem…" aria-label="Mensagem"></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>
  <div class="footnote" id="footnote">Protótipo · as respostas usam dados fictícios da loja</div>
</main>

<script>
if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
const SUGGESTIONS = [
  "Quais violões vocês têm até R$ 1000?",
  "Quanto custa o Takamine GD20?",
  "Qual o endereço da loja?",
  "Me arrependi da minha compra, posso devolver?",
];
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const chips = document.getElementById("chips");
let sessionId = null;

// Escape first, then allow only **bold** and line breaks: model output never becomes raw HTML (no XSS).
function renderSafe(text) {
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
}

function addMessage(role, text, trace) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "mel") {
    div.innerHTML = '<div class="who">Mel</div>' + renderSafe(text);
    if (trace && trace.length) {
      const details = document.createElement("details");
      details.className = "trace";
      const summary = document.createElement("summary");
      summary.textContent = `🔧 consultas internas: ${trace.length} ${trace.length === 1 ? "tool" : "tools"} (modo demonstração)`;
      details.appendChild(summary);
      for (const step of trace) {
        const code = document.createElement("code");
        code.textContent = `${step.tool}(${JSON.stringify(step.arguments)})${step.ok ? "" : "  ✗ erro"}`;
        details.appendChild(code);
      }
      div.appendChild(details);
    }
  } else {
    div.textContent = text;
  }
  log.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function api(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = typeof data.detail === "string" ? data.detail : "Não foi possível enviar a mensagem.";
    throw Object.assign(new Error(detail), { status: res.status });
  }
  return data;
}

async function startSession() {
  log.innerHTML = "";
  const data = await api("/api/sessions");
  sessionId = data.session_id;
  addMessage("mel", "Oi! Eu sou a **Mel**, assistente virtual do Empório da Música. Posso ajudar com instrumentos, preços, pedidos e políticas da loja. 🎸");
  renderChips();
}

function renderChips() {
  chips.innerHTML = "";
  for (const text of SUGGESTIONS) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.onclick = () => submit(text);
    chips.appendChild(b);
  }
}

async function submit(text) {
  text = text.trim();
  if (!text || send.disabled) return;
  chips.innerHTML = "";
  addMessage("you", text);
  input.value = "";
  send.disabled = true;
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "Mel está digitando…";
  log.appendChild(typing);
  try {
    const data = await api("/api/chat", { session_id: sessionId, message: text });
    addMessage("mel", data.reply, data.tool_trace);
    document.getElementById("footnote").textContent = `Protótipo · ${data.messages_left} mensagens restantes nesta conversa`;
  } catch (err) {
    addMessage("error", err.message);
    if (err.status === 404) await startSession();
  } finally {
    typing.remove();
    send.disabled = false;
    input.focus();
  }
}

// Embedded in the store page: accept questions only from the same origin (the "Perguntar à Mel" buttons).
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data || typeof e.data.ask !== "string") return;
  submit(e.data.ask.slice(0, 1000));
});
form.addEventListener("submit", (e) => { e.preventDefault(); submit(input.value); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(input.value); }
});
document.getElementById("reset").onclick = () => startSession().catch((e) => addMessage("error", e.message));

fetch("/health").then((r) => r.json()).then((h) => {
  if (h.demo_mode) {
    document.getElementById("demo-banner").style.display = "block";
    if (h.model) document.getElementById("model").textContent = ` · ${h.provider}/${h.model}`;
  }
}).catch(() => {});
startSession().then(() => {
  if (window.parent !== window) window.parent.postMessage({ ready: true }, location.origin);
}).catch((e) => addMessage("error", e.message));
</script>
</body>
</html>
