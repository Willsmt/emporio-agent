[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent prototype for Empório da Música"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "google-genai>=2.0",
    "openai>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5", "httpx>=0.27", "pytest-cov>=5", "radon>=6", "bandit>=1.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emporio = ["data/schema.sql", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: calls a real LLM provider (requires LLM_API_KEY); skipped otherwise"]
