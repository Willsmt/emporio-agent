name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Tests and coverage (offline, no API keys)
        run: pytest -q --cov=emporio --cov-report=term-missing:skip-covered

  security:
    name: security (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          # Old installers in the runner image get flagged by pip-audit; upgrade them first.
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Static analysis (Bandit)
        run: bandit -r src -q
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan the full history for leaked credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  complexity:
    name: complexity (no block ranked D or worse)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Complexity gate
        run: bash .claude/skills/cyclomatic-complexity/scripts/check_complexity.sh

  docker-smoke:
    name: integration (docker image smoke test)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build image (runs the ETL inside the build)
        run: docker build -t emporio:ci .
      - name: Start container with a dummy key (these endpoints never call the LLM)
        run: |
          docker run -d --name emporio -p 8000:8000 \
            -e LLM_PROVIDER=gemini -e LLM_API_KEY=dummy-key-for-smoke-test emporio:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs emporio
          exit 1
      - name: Smoke checks
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/ | grep -q "/static/js/store.js"
          curl -fsS http://127.0.0.1:8000/static/js/store.js | grep -q "/api/storefront"
          curl -fsS http://127.0.0.1:8000/chat | grep -qi "<html"
          curl -fsS http://127.0.0.1:8000/static/css/chat.css | grep -q "body"
          curl -fsSI http://127.0.0.1:8000/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsS http://127.0.0.1:8000/api/storefront | grep -q "categories"
          curl -fsS -X POST http://127.0.0.1:8000/api/sessions | grep -q "session_id"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/docs)" = "404"
          test "$(docker exec emporio id -u)" = "10001"
          echo "Image builds, serves the UI (with CSP) and API, keeps docs closed outside DEMO_MODE and runs as non-root."
      - name: Container logs on failure
        if: failure()
        run: docker logs emporio || true
