name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests and coverage (offline, no API keys)
        run: pytest -q --cov=emporio --cov-report=term-missing:skip-covered

      - name: Static security analysis (Bandit)
        run: bandit -r src -q

      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable

      - name: Complexity gate (no block ranked D or worse)
        run: bash .claude/skills/cyclomatic-complexity/scripts/check_complexity.sh
